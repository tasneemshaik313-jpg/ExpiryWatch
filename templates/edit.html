<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit · ExpiryWatch</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}">Expiry<span>Watch</span></a><nav class="main-nav"><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a><a class="account-link" href="{{ url_for('logout') }}">Sign out</a></nav></header>
<main class="page narrow-page"><a class="back-link" href="{{ url_for('index') }}">← Back to inventory</a><section class="panel edit-panel"><div class="section-heading"><div><span class="section-number">EDIT</span><h1>Edit product</h1></div></div>
<form method="post" class="edit-form"><div class="edit-product-preview">{% if product.photo %}<img src="{{ url_for('static', filename=product.photo) }}" alt="Product">{% endif %}<div><strong>{{ product.product_name }}</strong><span>{{ product.category }}</span></div></div>
<div class="form-grid"><div><label>Product name</label><input name="product_name" value="{{ product.product_name }}" required></div><div><label>Category</label><select name="category">{% for c in categories %}<option {% if product.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div><label>Manufacturing date</label><input name="manufacturing_date" value="{{ product.manufacturing_date or '' }}" placeholder="MM/YYYY"></div><div><label>Expiry date</label><input name="expiry_date" value="{{ product.expiry_date or product.estimated_expiry or '' }}" placeholder="MM/YYYY"></div><div><label>Quantity</label><input type="number" min="1" name="quantity" value="{{ product.quantity or 1 }}"></div></div>
<div class="edit-actions"><a class="secondary" href="{{ url_for('index') }}">Cancel</a><button class="primary" type="submit">Save changes <span>→</span></button></div></form></section></main>
</body></html>
