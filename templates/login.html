<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - ExpiryWatch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-page">

    <!-- LEFT VISUAL PANEL -->
    <section class="visual-panel">

        <img
            src="{{ url_for('static', filename='uploads/Expiry.png') }}"
            alt="ExpiryWatch"
            class="visual-image"
        >

        <div class="visual-overlay"></div>

       
        <div class="visual-content">


          
            

            <div class="feature-list">

                <div class="feature-item">
                    
                  
                </div>

                <div class="feature-item">
                    
                  
                </div>

                <div class="feature-item">
                    
                   
                </div>

            </div>

        </div>

        

    </section>


    <!-- LOGIN PANEL -->
    <section class="login-panel">

        <div class="login-container">

            <div class="mobile-brand">
                <div class="mobile-logo">EW</div>
                <div class="mobile-name">
                    <span>Expiry</span><b>Watch</b>
                </div>
            </div>

            <div class="login-heading">

                <div class="login-eyebrow">
                    SECURE SIGN IN
                </div>

                <h2>Welcome back</h2>

                <p>
                    Sign in to access your saved products and
                    expiry alerts.
                </p>

            </div>


            <!-- FLASH MESSAGES -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages">

                        {% for message in messages %}
                            <div class="flash-message">
                                {{ message }}
                            </div>
                        {% endfor %}

                    </div>
                {% endif %}
            {% endwith %}


            <!-- LOGIN FORM -->
            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
            >

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="password-label-row">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    <span>Sign in</span>
                    <span class="arrow">→</span>
                </button>

            </form>


            <div class="register-area">

                <span>New to ExpiryWatch?</span>

                <a href="{{ url_for('register') }}">
                    Create account
                </a>

            </div>


            <div class="security-note">

              

               

            </div>

        </div>

    </section>

</div>


<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    if (togglePassword && passwordInput) {

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "◉";
                togglePassword.style.opacity = "1";

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "◉";
                togglePassword.style.opacity = "0.55";

            }

        });

    }
</script>

</body>
</html>
